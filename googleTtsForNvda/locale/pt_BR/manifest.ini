summary = "Google TTS Para NVDA"
description = """Permite usar localmente as vozes de texto para fala do Google baseadas em WASM por meio de um ambiente de execução de navegador Chromium compatível, como Google Chrome, Microsoft Edge ou Brave, e empregá-las como sintetizador do NVDA. O Google TTS Para NVDA é um projeto de acessibilidade independente e de código aberto. Não é afiliado ao Google LLC nem conta com seu patrocínio ou endosso. Google é uma marca comercial do Google LLC."""
changelog = """Versão 1.0:
- Melhorada a capacidade de resposta na leitura de textos médios e longos, com início mais rápido da fala, armazenamento de áudio em buffer mais fluido e reaproveitamento do áudio já gerado, mantido temporariamente na RAM.
- Melhorada a divisão de frases e expressões em textos multilíngues, assim como o recurso Usar perfis de idioma automáticos, com base nos dados oficiais do Unicode 17.0 e do CLDR 48.2.
- Aumentado o volume padrão da fala, que agora se mantém mais estável, sem subidas e quedas anormais. A configuração Volume continua proporcional. A distorção em algumas vozes masculinas vem do motor WASM TTS original e não é corrigida por esta alteração.
- Melhorada a recuperação após falhas no ambiente de execução do navegador Chromium, no motor WASM TTS e na saída de áudio do NVDA; a opção Manter o ambiente de execução do navegador do Google TTS pronto em segundo plano não preserva mais ambientes com problemas; e foram reduzidos os conflitos com outros complementos.
- Atualizado o motor WASM TTS incluído para a versão 20260917.1.
- Adicionadas as traduções para espanhol e português do Brasil, e reescrita a tradução para chinês simplificado com a terminologia oficial do NVDA."""
